; Compilacao local com PlatformIO do diagnostico do item 1 (compilado em 26/11/2026).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@8.0.0  ; versao com que o firmware compilou em 26/11/2026
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<testes-wokwi/> -<*.chip.c>
