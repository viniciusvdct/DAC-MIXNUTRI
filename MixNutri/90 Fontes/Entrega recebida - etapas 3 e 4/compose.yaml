name: iot-mixnutri
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports: ["${MQTT_BIND:-127.0.0.1}:1883:1883"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iotmixnutri}
      POSTGRES_USER: ${POSTGRES_USER:-iot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_local}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-troque_esta_senha_leitura}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  modbus-sim:
    build: ./modbus-simulator
    restart: unless-stopped
    ports: ["127.0.0.1:5020:5020"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',5020),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  node-red:
    build: ./node-red
    restart: unless-stopped
    environment:
      TZ: America/Campo_Grande
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:-troque-esta-chave}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-iotmixnutri}
      PGUSER: ${POSTGRES_USER:-iot_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha_local}
      MQTT_URL: mqtt://mosquitto:1883
      MODBUS_HOST: ${MODBUS_HOST:-modbus-sim}
      MODBUS_PORT: ${MODBUS_PORT:-5020}
      MODBUS_UNIT_ID: ${MODBUS_UNIT_ID:-1}
      PLC_MODE: ${PLC_MODE:-simulated}
      S7_HOST: ${S7_HOST:-192.168.0.10}
      S7_RACK: ${S7_RACK:-0}
      S7_SLOT: ${S7_SLOT:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports: ["127.0.0.1:1880:1880"]
    volumes: ["node_red_data:/data"]
    depends_on:
      mosquitto: {condition: service_healthy}
      postgres: {condition: service_healthy}
      modbus-sim: {condition: service_healthy}

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque_esta_senha_grafana}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-troque_esta_senha_leitura}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  node_red_data:
  grafana_data:
