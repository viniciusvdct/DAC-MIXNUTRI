; Teste de bancada do kit fisico (sem rede). Usa hardware_fisico.h da pasta do firmware.
; macOS/Linux: ../gravar_esp32.sh bancada
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>
build_flags = -I${PROJECT_DIR}/../firmware
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
