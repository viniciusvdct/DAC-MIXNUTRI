; Compilacao local com PlatformIO (para Wokwi CLI / VS Code ou placa fisica).
; Usa os mesmos arquivos do Wokwi web. Nao foi executado nesta sessao (sem toolchain local).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = -<*> +<sketch.ino>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
