; Compilacao local com PlatformIO (para Wokwi CLI / VS Code ou placa fisica).
; Usa os mesmos arquivos do Wokwi web e do ESP32 fisico.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@8.0.0  ; versao com que o firmware compilou em 26/11/2026
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<*> -<testes/> -<*.chip.c>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
  ; DHT11 do kit fisico (hardware_fisico.h); o modo Wokwi nao usa
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
