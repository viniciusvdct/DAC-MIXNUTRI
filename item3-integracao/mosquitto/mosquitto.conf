# Mosquitto da proposta do item 3 (equipe 1 -> equipe 2). Somente localhost, dados sinteticos.
# passwd e acl sao gerados por iniciar.sh a partir das credenciais de teste do .env.
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
