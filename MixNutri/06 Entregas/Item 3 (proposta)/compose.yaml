# Item 3 — PROPOSTA da equipe 1 para a equipe 2 avaliar a integracao com o firmware do item 2.
# Nao e a entrega da equipe 2. Somente localhost, dados sinteticos, credenciais de teste do .env.
# Uso: cp .env.exemplo .env && docker compose up -d --build
name: mixnutri-item3

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    # Gera senhas e ACL a partir do .env e inicia o broker sem acesso anonimo.
    entrypoint: ["/bin/sh", "/mixnutri/iniciar.sh"]
    environment:
      MQTT_ESP32_USUARIO: ${MQTT_ESP32_USUARIO:?defina no .env}
      MQTT_ESP32_SENHA: ${MQTT_ESP32_SENHA:?defina no .env}
      MQTT_BACKEND_USUARIO: ${MQTT_BACKEND_USUARIO:?defina no .env}
      MQTT_BACKEND_SENHA: ${MQTT_BACKEND_SENHA:?defina no .env}
    volumes:
      - ./mosquitto:/mixnutri:ro
      - mosquitto-dados:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_BACKEND_USUARIO\" -P \"$$MQTT_BACKEND_SENHA\" -t mixnutri/sala01/disponibilidade -E -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mixnutri
      POSTGRES_USER: ${POSTGRES_USUARIO:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina no .env}
      PG_NODERED_SENHA: ${PG_NODERED_SENHA:?defina no .env}
      PG_GRAFANA_SENHA: ${PG_GRAFANA_SENHA:?defina no .env}
    volumes:
      # Schema v2 do item 1, sem copia nem alteracao. Os scripts so rodam com o volume vazio.
      - "../Item 1/banco/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"
      - ./postgres/02_integracao.sql:/docker-entrypoint-initdb.d/02_integracao.sql:ro
      - ./postgres/03_senhas.sh:/docker-entrypoint-initdb.d/03_senhas.sh:ro
      - postgres-dados:/var/lib/postgresql
    ports:
      - "127.0.0.1:${PG_PORTA_HOST:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d mixnutri"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  node-red:
    build: ./node-red
    image: mixnutri-item3-node-red:proposta
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MQTT_BACKEND_USUARIO: ${MQTT_BACKEND_USUARIO:?defina no .env}
      MQTT_BACKEND_SENHA: ${MQTT_BACKEND_SENHA:?defina no .env}
      PG_NODERED_USUARIO: nodered_ingestao
      PG_NODERED_SENHA: ${PG_NODERED_SENHA:?defina no .env}
      NODERED_ADMIN_USUARIO: ${NODERED_ADMIN_USUARIO:?defina no .env}
      NODERED_ADMIN_SENHA: ${NODERED_ADMIN_SENHA:?defina no .env}
    volumes:
      # flows.json, flows_cred.json (so referencias ${VAR}) e settings.js versionados aqui.
      - ./node-red/dados:/data
    ports:
      - "127.0.0.1:1880:1880"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.13
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USUARIO:?defina no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_SENHA:?defina no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Sem downloads de plugins nem consultas externas ao iniciar.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mixnutri-sala01.json
      PG_GRAFANA_SENHA: ${PG_GRAFANA_SENHA:?defina no .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-dados:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mosquitto-dados:
  postgres-dados:
  grafana-dados:
